#file: noinspection YAMLIncompatibleTypes
---
test_name: X-Sovereign-Response-Source header is present on v2 discovery responses

marks:
  - all
  - usefixtures:
      - auth_string
      - skip_if_not_worker_v2

stages:
  - name: First request returns a response source
    max_retries: 5
    delay_after: 2
    request:
      url: 'http://sovereign:8080/v3/discovery:clusters'
      method: POST
      json: &source_test_request
        node:
          id: envoy
          cluster: T1
          build_version: e5f864a82d4f27110359daa2fbdcb12d99e415b9/1.36.0/Clean/RELEASE
          locality:
            zone: us-east-1
          metadata:
            auth: '{auth_string}'
            ipv4: 127.0.0.1
        resource_names: []
        version_info: '0'
      headers: &source_test_headers
        content-type: application/json
        accept-encoding: None
    response:
      strict: no
      status_code: 200
      headers:
        X-Sovereign-Response-Source: !anystr
  - name: Second request returns immediately
    request:
      url: 'http://sovereign:8080/v3/discovery:clusters'
      method: POST
      json: *source_test_request
      headers: *source_test_headers
    response:
      strict: no
      status_code: 200
      headers:
        X-Sovereign-Response-Source: immediately

---
test_name: X-Sovereign-Response-Source returns inline for render_inline requests

marks:
  - all
  - usefixtures:
      - auth_string
      - skip_if_not_worker_v2

stages:
  - name: Request with sovereign.render_inline metadata
    max_retries: 5
    delay_after: 2
    request:
      url: 'http://sovereign:8080/v3/discovery:clusters'
      method: POST
      json:
        node:
          id: envoy
          cluster: T1
          build_version: e5f864a82d4f27110359daa2fbdcb12d99e415b9/1.36.0/Clean/RELEASE
          locality:
            zone: us-east-1
          metadata:
            auth: '{auth_string}'
            ipv4: 127.0.0.1
            sovereign:
              render_inline: true
        resource_names: []
        version_info: '0'
      headers:
        content-type: application/json
        accept-encoding: None
    response:
      strict: no
      status_code: 200
      headers:
        X-Sovereign-Response-Source: inline
